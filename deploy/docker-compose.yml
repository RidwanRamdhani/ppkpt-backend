services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ppkpt_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD}
      POSTGRES_DB: ppkpt
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppkpt_owner -d ppkpt"]
      interval: 5s
      retries: 10

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silodata:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP (dipakai app)
      - "8025:8025"   # Web UI

volumes:
  dbdata: {}
  silodata: {}